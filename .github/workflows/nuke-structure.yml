name: Nuke project structure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to confirm removal of all generated files'
        required: true
      template:
        description: 'Path to .mdix template (so we know what to remove)'
        required: false
        default: '.mdix/project_structure/project_structure.mdix'

jobs:
  nuke:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Guard — require exact confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DELETE" ]; then
            echo "::error::You must type exactly: DELETE"
            exit 1
          fi
          echo "Confirmation accepted."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install midmanstudio-mdix
        run: |
          if [ -f "scripts/requirements.txt" ]; then
            pip install -r scripts/requirements.txt
          else
            pip install midmanstudio-mdix
          fi

      - name: Resolve nuke script
        id: script
        run: |
          if [ -f "scripts/nuke_structure.py" ]; then
            echo "path=scripts/nuke_structure.py" >> "$GITHUB_OUTPUT"
            echo "Using local script."
          else
            echo "Local script not found — fetching from mdix-scaffold..."
            curl -fsSL \
              "https://raw.githubusercontent.com/Mid-D-Man/mdix-scaffold/main/scripts/nuke_structure.py" \
              -o /tmp/nuke_structure.py
            echo "path=/tmp/nuke_structure.py" >> "$GITHUB_OUTPUT"
            echo "Using fetched script."
          fi

      - name: Resolve support libs
        run: |
          SCRIPT_DIR=$(dirname "${{ steps.script.outputs.path }}")
          for lib in lib_mdix_load.py; do
            if [ -f "scripts/$lib" ]; then
              [ "$SCRIPT_DIR" != "scripts" ] && cp "scripts/$lib" "$SCRIPT_DIR/$lib"
              echo "  local   $lib"
            else
              curl -fsSL \
                "https://raw.githubusercontent.com/Mid-D-Man/mdix-scaffold/main/scripts/$lib" \
                -o "$SCRIPT_DIR/$lib"
              echo "  fetched $lib"
            fi
          done

      - name: Remove generated files
        run: |
          python3 ${{ steps.script.outputs.path }} \
            --confirm DELETE \
            --template "${{ github.event.inputs.template }}"

      - name: Show git status
        run: git status --short || true

      - name: Commit removal
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet \
            && echo "Nothing to commit — structure was already clean." \
            || git commit -m "chore: nuke project structure [skip ci]"
          git push
