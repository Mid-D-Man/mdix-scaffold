name: Generate project structure

on:
  workflow_dispatch:
    inputs:
      template:
        description: 'Path to .mdix template (relative to repo root)'
        required: false
        default: '.mdix/project_structure/project_structure.mdix'
      override_stubs:
        description: 'Overwrite existing stub files (true/false)'
        required: false
        default: 'false'
      dry_run:
        description: 'Preview without writing anything (true/false)'
        required: false
        default: 'false'
      delete_processed_archives:
        description: 'Replacements pass only. After a clean, non-dry-run apply, delete top-level archive(s) from replacements/ so they cannot be accidentally re-run later (true/false)'
        required: false
        default: 'false'
      file_strategy:
        description: 'How to handle existing files: skip | overwrite | backup | rename'
        required: false
        default: 'skip'
      mappings_file:
        description: 'Path to .mdix mappings file for [[key]] substitution (leave blank to skip)'
        required: false
        default: ''
      dump_json:
        description: 'Dump the full untruncated structure JSON (true/false)'
        required: false
        default: 'false'
  push:
    paths:
      - '.mdix/project_structure/**'
  workflow_call:
    inputs:
      template:
        description: 'Path to .mdix template'
        required: false
        type: string
        default: '.mdix/project_structure/project_structure.mdix'
      override_stubs:
        required: false
        type: string
        default: 'false'
      dry_run:
        required: false
        type: string
        default: 'false'
      delete_processed_archives:
        required: false
        type: string
        default: 'false'
      file_strategy:
        required: false
        type: string
        default: 'skip'
      mappings_file:
        required: false
        type: string
        default: ''
      dump_json:
        required: false
        type: string
        default: 'false'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install midmanstudio-mdix
        run: |
          if [ -f "scripts/requirements.txt" ]; then
            pip install -r scripts/requirements.txt
          else
            pip install midmanstudio-mdix
          fi
          python3 -c "from midmanstudio.mdix import MdixDatabase; print('midmanstudio-mdix OK')"

      - name: Resolve generation script
        id: script
        run: |
          if [ -f "scripts/generate_structure.py" ]; then
            echo "path=scripts/generate_structure.py" >> "$GITHUB_OUTPUT"
            echo "Using local script from repo."
          else
            echo "Local script not found — fetching from mdix-scaffold..."
            curl -fsSL \
              "https://raw.githubusercontent.com/Mid-D-Man/mdix-scaffold/main/scripts/generate_structure.py" \
              -o /tmp/generate_structure.py
            echo "path=/tmp/generate_structure.py" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve support libs
        run: |
          SCRIPT_DIR=$(dirname "${{ steps.script.outputs.path }}")
          for lib in lib_mdix_load.py lib_remote.py lib_mappings.py lib_patch.py lib_replacements.py; do
            if [ -f "scripts/$lib" ]; then
              [ "$SCRIPT_DIR" != "scripts" ] && cp "scripts/$lib" "$SCRIPT_DIR/$lib"
              echo "  local   $lib"
            else
              curl -fsSL \
                "https://raw.githubusercontent.com/Mid-D-Man/mdix-scaffold/main/scripts/$lib" \
                -o "$SCRIPT_DIR/$lib"
              echo "  fetched $lib"
            fi
          done

      - name: Validate template
        run: |
          TMPL="${{ inputs.template || '.mdix/project_structure/project_structure.mdix' }}"
          python3 "${{ steps.script.outputs.path }}" --template "$TMPL" --validate-only

      - name: Generate project structure
        env:
          TEMPLATE_PATH:  ${{ inputs.template || '.mdix/project_structure/project_structure.mdix' }}
          OVERRIDE_STUBS: ${{ inputs.override_stubs || 'false' }}
          DRY_RUN:        ${{ inputs.dry_run || 'false' }}
          FILE_STRATEGY:  ${{ inputs.file_strategy || 'skip' }}
          MAPPINGS_FILE:  ${{ inputs.mappings_file || '' }}
          DUMP_JSON:      ${{ inputs.dump_json || 'false' }}
          DELETE_PROCESSED_ARCHIVES: ${{ inputs.delete_processed_archives || 'false' }}
        run: |
          python3 "${{ steps.script.outputs.path }}"

      - name: Show git status
        if: ${{ inputs.dry_run != 'true' }}
        run: git status --short || true

      - name: Commit generated structure
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet \
            && echo "Nothing new to commit — structure is up to date." \
            || git commit -m "chore: sync project structure from template [skip ci]"
          git push
